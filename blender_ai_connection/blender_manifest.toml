# Blender Extensions platform manifest (Blender 4.2+).
# Older Blenders (< 4.2) ignore this file and use bl_info in __init__.py.
schema_version = "1.0.0"

id = "blender_ai_connection"
version = "1.0.0"
name = "Blender AI Connection"
tagline = "MCP-based AI production agent: natural-language modeling, materials, animation, lighting and cutscenes."
maintainer = "CoolAddon"
type = "add-on"
tags = ["3D View", "Animation", "Scene", "System"]

blender_version_min = "4.2.0"

license = ["SPDX:MIT"]
website = "https://github.com/errored404user/CoolAddon"

# The addon runs a local TCP bridge + HTTP calls to LLM APIs (network)
# and can export a log text file next to the .blend (files).
permissions = ["network", "files"]
